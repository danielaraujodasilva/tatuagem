<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gestão • Cartório</title><link rel="stylesheet" href="./styles.css"><style>main{max-width:1100px;margin:auto;padding:28px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.tabs button{padding:10px;border:1px solid #ddd;background:#fff;border-radius:8px}.box{background:#fff;border:1px solid #eaecf0;border-radius:14px;padding:20px;margin:12px 0}input,select,textarea{padding:10px;margin:4px;width:min(100%,280px)}button{cursor:pointer}.row{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid #eee;flex-wrap:wrap}</style><main><a href="./admin.php">← Voltar ao painel</a><h1>Gestão do sistema</h1><nav class="tabs"><button data-tab="users">Usuários e permissões</button><button data-tab="services">Serviços configuráveis</button><button data-tab="reports">Relatórios</button><button data-tab="maintenance">Backup e políticas</button></nav><section id="users" class="box"></section><section id="services" class="box" hidden></section><section id="reports" class="box" hidden></section><section id="maintenance" class="box" hidden></section></main><script>
const api=async(a,o)=>{const r=await fetch('./api.php?action='+a,o&&{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(o)});return r.json()};const q=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
async function users(){const d=await api('admin_users');q('#users').innerHTML='<h2>Usuários</h2><button onclick="newUser()">Novo usuário</button>'+d.users.map(u=>`<div class="row"><strong>${esc(u.username)}</strong><span>${esc(u.role)}</span><button onclick="editUser(${u.id},'${esc(u.username)}','${esc(u.role)}')">Editar</button></div>`).join('')};window.newUser=()=>{const u=prompt('Usuário/e-mail');if(!u)return;const p=prompt('Senha (mínimo 8 caracteres)');const r=prompt('Perfil: admin, operator ou attendant','operator');api('admin_user_save',{username:u,password:p,role:r}).then(users)};window.editUser=(id,u,r)=>{const p=prompt('Nova senha (deixe vazio para manter)');api('admin_user_save',{id,username:u,password:p||'',role:r}).then(users)};
async function services(){const d=await api('admin_services');q('#services').innerHTML='<h2>Serviços</h2><button onclick="newService()">Novo serviço</button>'+d.services.map(s=>`<div class="row"><strong>${esc(s.title)}</strong><span>R$ ${Number(s.price).toFixed(2)}</span><span>${s.active?'Ativo':'Inativo'}</span></div>`).join('')};window.newService=()=>{const t=prompt('Título');if(!t)return;api('admin_service_save',{title:t,description:prompt('Descrição',''),price:Number(prompt('Preço base','0')),active:true}).then(services)};
async function reports(){const d=await api('admin_report');q('#reports').innerHTML=`<h2>Relatórios</h2><p>${d.total} ticket(s) ativos • R$ ${Number(d.amount).toFixed(2)} movimentados</p>${d.by_status.map(x=>`<div class="row"><strong>${esc(x.status)}</strong><span>${x.total} ticket(s)</span><span>R$ ${Number(x.amount).toFixed(2)}</span></div>`).join('')}`};async function maintenance(){const d=await api('admin_policy');q('#maintenance').innerHTML='<h2>Backup e políticas</h2><p>Uploads: '+d.policy.allowed_types.join(', ')+' • Limite: '+d.policy.max_upload_mb+' MB • Retenção: '+d.policy.retention_days+' dias</p><a class="btn primary" href="./api.php?action=admin_backup">Baixar backup JSON</a>'};document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('section').forEach(s=>s.hidden=s.id!==b.dataset.tab);({users,services,reports,maintenance}[b.dataset.tab])()});users();
</script>
