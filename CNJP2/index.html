<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <meta name="theme-color" content="#f7f8fb" />
  <title>CNJP2 • Mapa Interno</title>
  <meta name="description" content="Mapa interno de serviços, prioridades, valores e oportunidades da CNJP." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..700,0..1,0&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css?v=20260824-1507" />
</head>
<body>
  <main class="shell">
    <div class="topline">
      <div><strong>CNJP2</strong><span>mapa interno de serviços, prioridades e valores</span></div>
      <span class="internal-badge">uso interno</span>
    </div>

    <section class="toolbar" aria-label="Ferramentas">
      <label class="search-box">
        <span class="material-symbols-rounded">search</span>
        <input id="search" type="search" placeholder="Buscar serviço, problema ou tecnologia…" autocomplete="off" />
        <kbd>/</kbd>
      </label>
      <div class="toolbar-actions">
        <button id="expandAll" class="ghost-btn" type="button"><span class="material-symbols-rounded">unfold_more</span>Abrir tudo</button>
        <button id="collapseAll" class="ghost-btn" type="button"><span class="material-symbols-rounded">unfold_less</span>Fechar tudo</button>
      </div>
    </section>

    <section class="summary-grid" id="summary"></section>

    <section class="control-panel">
      <div class="filter-block">
        <span class="control-title">Tipo de atuação</span>
        <div class="chips" id="filters"></div>
      </div>

      <div class="selector-block">
        <label>
          <span class="control-title">Faixa de valor</span>
          <select id="priceFilter">
            <option value="all">Todos os valores</option>
            <option value="0-200">Até R$ 200</option>
            <option value="201-500">R$ 201 a R$ 500</option>
            <option value="501-1000">R$ 501 a R$ 1.000</option>
            <option value="1001-2500">R$ 1.001 a R$ 2.500</option>
            <option value="2501-5000">R$ 2.501 a R$ 5.000</option>
            <option value="5001-999999">Acima de R$ 5.000</option>
          </select>
        </label>
      </div>

      <div class="sort-block">
        <label>
          <span class="control-title">Ordenar por</span>
          <select id="sortBy">
            <option value="score">Prioridade geral</option>
            <option value="price">Valor de venda</option>
            <option value="ease">Facilidade de executar</option>
            <option value="revenue">Potencial de receita</option>
            <option value="recurring">Potencial de recorrência</option>
            <option value="complexity">Complexidade</option>
            <option value="title">Nome</option>
          </select>
        </label>
        <button id="sortDirection" class="direction-btn" type="button" aria-label="Alternar ordem">
          <span class="material-symbols-rounded">south</span><span id="sortDirectionText">Maior → menor</span>
        </button>
        <button id="applySort" class="primary-btn" type="button"><span class="material-symbols-rounded">sort</span>Aplicar</button>
      </div>
    </section>

    <div class="result-line"><span id="resultCount"></span><button id="clearFilters" type="button" class="text-btn">Limpar filtros</button></div>
    <section id="catalog" class="catalog" aria-live="polite"></section>

    <footer>
      <p>Valores são estimativas internas de preço de venda e devem ser validados antes da oferta comercial.</p>
      <p class="fineprint">Nos itens-mãe, o valor exibido é a faixa dos serviços contidos abaixo deles.</p>
    </footer>
  </main>

  <template id="nodeTemplate">
    <details class="service-node">
      <summary>
        <div class="summary-main">
          <span class="node-icon material-symbols-rounded">folder</span>
          <div class="node-copy">
            <div class="node-title-row"><h3 class="node-title"></h3><span class="stage-badge" hidden></span><span class="score-badge"></span><span class="price-badge"></span></div>
            <p class="node-description"></p>
            <div class="metrics-mini"></div>
          </div>
        </div>
        <div class="summary-side"><div class="node-tags"></div><span class="chevron material-symbols-rounded">expand_more</span></div>
      </summary>
      <div class="node-content"></div>
    </details>
  </template>

  <script type="module" src="./app.js?v=20260824-1507"></script>
</body>
</html>
